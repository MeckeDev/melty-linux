name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm,appimage'
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            patchelf \
            libfuse2 \
            desktop-file-utils \
            p7zip-full \
            unrar \
            libarchive-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi
        shell: bash

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Melty-Linux {0}', github.ref_name) || '' }}
          releaseBody: |
            Native, cross-platform client for [melty.gg](https://melty.gg) (unofficial community project).

            ## Downloads

            **Linux**
            - `.AppImage` — universal, no installation required (`chmod +x *.AppImage`)
            - `.deb` — Debian/Ubuntu: `sudo dpkg -i melty-linux_*.deb`
            - `.rpm` — Fedora/RHEL/openSUSE: `sudo rpm -i melty-linux-*.rpm`

            **Windows**
            - `.exe` (NSIS installer) — recommended
            - `.msi` — Windows Installer package

            See the [README](https://github.com/MeckeDev/melty-linux#readme) for prerequisites and troubleshooting.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
